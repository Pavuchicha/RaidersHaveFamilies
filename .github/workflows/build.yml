name: NJR - Not Just Raiders v0.16.0-beta1 (RimWorld 1.7, Harmony 3)
# Retains regression requirements introduced in 0.12.1 through 0.12.4.

on:
  workflow_dispatch:
  push:
    paths:
      - 'RaidersHaveFamilies/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify metadata, source contracts, and budget invariants
        run: |
          python3 tests/validate.py
          python3 tests/performance_contract.py
          python3 tests/operations_contract.py
          python3 tests/debug_actions_031.py
          python3 tests/wce_manifest.py
          python3 tests/rhf_040_contracts.py
          python3 tests/rhf_050_diplomacy.py
          python3 tests/precept_notes_032.py
          python3 tests/csharp_lexical_050.py
          python3 tests/rhf_060_coalitions.py
          python3 tests/rhf_061_compile_contract.py
          python3 tests/rhf_070_regressions.py
          python3 tests/rhf_080_mercy_and_drops.py
          python3 tests/rhf_090_tactical.py
          python3 tests/rhf_091_guest_api.py
          python3 tests/rhf_092_psychological_cruelty.py
          python3 tests/rhf_100_death_and_reprisals.py
          python3 tests/rhf_101_native_precept_mood.py
          python3 tests/rhf_110_family_escort_dialogue.py
          python3 tests/rhf_120_conversion_campaigns.py
          python3 tests/rhf_121_coherent_ops.py
          python3 tests/rhf_123_rescue_control.py
          python3 tests/rhf_124_rescue_command.py
          python3 tests/rhf_125_combat_planner.py
          python3 tests/rhf_126_smart_routes_and_cover.py
          python3 tests/rhf_127_faction_and_strength.py
          python3 tests/rhf_128_route_control.py
          python3 tests/rhf_129_firebreak.py
          python3 tests/rhf_130_mission_integrity.py
          python3 tests/rhf_131_vip_job_recovery.py
          python3 tests/rhf_132_mission_authority.py
          python3 tests/rhf_133_arrival_and_lord.py
          python3 tests/rhf_134_owner_integrity.py
          python3 tests/rhf_135_s1_rescue_contracts.py
          python3 tests/rhf_136_tactical_playtest_contracts.py
          python3 tests/rhf_137_harmony_hotfix_contracts.py
          python3 tests/rhf_138_air_only_pod_gate.py
          python3 tests/rhf_139_assembly_breach_fortify.py
          python3 tests/rhf_140_s221_engineer_door_contact.py
          python3 tests/rhf_144_s311_vip_native.py
          python3 tests/rhf_151_s41_rescue_single_writer.py
          python3 tests/rhf_152_s41_agent_review_fixes.py
          python3 tests/rhf_153_s41_agent3_combat_and_escort.py
          python3 tests/rhf_154_s41_phase3_native_roles.py
          python3 tests/rhf_155_s41_airflight.py
          python3 tests/rhf_156_s41_offense_single_writer.py
          python3 tests/rhf_157_s41_native_lords.py
          python3 tests/rhf_158_s41_beast_incident_and_flank.py
          python3 tests/rhf_159_s41_native_lord_identity.py
          python3 tests/rhf_160_s41_multivip_downed_single_writer.py
          python3 tests/rhf_161_s41_air_vip_lifetime_and_exit_recovery.py
          python3 tests/rhf_162_s41_fuel_reachable_destination.py
          python3 tests/rhf_163_s41_offense_missing_breacher.py
          python3 tests/rhf_164_s41_field_breach_pod_entry.py
          python3 tests/rhf_165_s41_inventory_pod_enemy_faction.py
          python3 tests/rhf_166_s41_spawn_and_barricade.py
          python3 tests/rhf_167_s41_prepared_relay.py
          python3 tests/njr_200_integrity_audit.py
          python3 tests/njr_202_field_ops_regressions.py
          python3 tests/njr_203_p0_rescue_entry_pod_site.py
          python3 tests/njr_204_real_playtest_failures.py
          python3 tests/njr_206_world_kin_reuse.py
          python3 tests/njr_207_group_ransom_contract.py
          python3 tests/njr_208_conversion_privacy.py
          python3 tests/njr_209_group_selection_dispatch.py
          python3 tests/njr_210_offense_tactics.py
          python3 tests/njr_211_tech_budget_route_office_passive.py
          python3 tests/njr_212_random_debug_factions_and_audit.py
          python3 tests/njr_213_global_forensic_regressions.py
          python3 tests/njr_214_compatibility_and_passive_cache.py
          python3 tests/njr_216_unbounded_combat_doctrine.py
          python3 tests/njr_217_contact_pursuit_recovery.py
          python3 tests/njr_218_combat_combinations.py
          python3 tests/njr_219_community_ai_manual_review.py
          python3 tests/njr_220_mission_intelligence_r014.py
          python3 tests/njr_221_route_execution_r015.py
          python3 tests/njr_222_ground_rescue_actual_arrival_r016.py
          python3 tests/njr_223_force_strength_coordinated_breach_r017.py
          python3 tests/njr_224_r019_ai_regression_gate.py
          python3 tests/njr_225_r020_command_stability.py
          python3 tests/njr_226_r021_leaderless_multisource.py
          python3 tests/njr_227_r023_rescue_priority_spawn_authority.py
          python3 tests/njr_228_r024_old_beta2_weighted_rescue.py
          python3 tests/njr_229_r025_end_to_end_rescue_regressions.py
      - name: Restore RimWorld 1.7 / Harmony 3 references
        run: dotnet restore RaidersHaveFamilies/Source/RaidersHaveFamilies.csproj
      - name: Compile mod DLL (fail on errors)
        run: dotnet build RaidersHaveFamilies/Source/RaidersHaveFamilies.csproj -c Release --no-restore
      - name: Verify compiled DLL
        run: test -s RaidersHaveFamilies/Assemblies/RaidersHaveFamilies.dll
      - name: Package installable mod
        run: |
          set -euxo pipefail
          mkdir -p _release/NJR-NotJustRaiders
          cp -a RaidersHaveFamilies/About RaidersHaveFamilies/Languages RaidersHaveFamilies/Defs RaidersHaveFamilies/Textures RaidersHaveFamilies/Assemblies _release/NJR-NotJustRaiders/
          cd _release
          zip -qr ../NJR_NotJustRaiders_v0.16.0-beta1_RimWorld_1.7_INSTALL.zip NJR-NotJustRaiders
      - name: Validate NJR install ZIP
        run: python3 tests/njr_201_release_zip.py NJR_NotJustRaiders_v0.16.0-beta1_RimWorld_1.7_INSTALL.zip
      - name: Upload test build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NJR-NotJustRaiders-RimWorld-1.7-v0.16.0-beta1
          path: NJR_NotJustRaiders_v0.16.0-beta1_RimWorld_1.7_INSTALL.zip
          if-no-files-found: error
