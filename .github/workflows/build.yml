name: Build Raiders Have Families 0.5.0 (RimWorld 1.7, Harmony 3)

on:
  workflow_dispatch:
  push:
    paths:
      - 'RaidersHaveFamilies/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify metadata, source contracts, and budget invariants
        run: |
          python3 tests/validate.py
          python3 tests/performance_contract.py
          python3 tests/operations_contract.py
          python3 tests/debug_actions_031.py
          python3 tests/wce_manifest.py
          python3 tests/rhf_040_contracts.py
          python3 tests/rhf_050_diplomacy.py
          python3 tests/precept_notes_032.py
          python3 tests/csharp_lexical_050.py
      - name: Restore RimWorld 1.7 / Harmony 3 references
        run: dotnet restore RaidersHaveFamilies/Source/RaidersHaveFamilies.csproj
      - name: Compile mod DLL (fail on errors)
        run: dotnet build RaidersHaveFamilies/Source/RaidersHaveFamilies.csproj -c Release --no-restore
      - name: Verify compiled DLL
        run: test -s RaidersHaveFamilies/Assemblies/RaidersHaveFamilies.dll
      - name: Package installable mod
        run: |
          set -euxo pipefail
          mkdir -p _release/RaidersHaveFamilies
          cp -a RaidersHaveFamilies/About RaidersHaveFamilies/Languages RaidersHaveFamilies/Defs RaidersHaveFamilies/Textures RaidersHaveFamilies/Assemblies _release/RaidersHaveFamilies/
          cd _release
          zip -qr ../RaidersHaveFamilies_v0.5.0_RimWorld_1.7_INSTALL.zip RaidersHaveFamilies
      - name: Upload test build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RaidersHaveFamilies-RimWorld-1.7-v0.5.0-DIPLOMACY-TEST
          path: RaidersHaveFamilies_v0.5.0_RimWorld_1.7_INSTALL.zip
          if-no-files-found: error
