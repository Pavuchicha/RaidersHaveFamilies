name: Build Raiders Have Families 0.13.3 S2.2.1 (RimWorld 1.7, Harmony 3)
# Retains regression requirements introduced in 0.12.1 through 0.12.4.

on:
  workflow_dispatch:
  push:
    paths:
      - 'RaidersHaveFamilies/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  compile-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify metadata, source contracts, and budget invariants
        run: |
          python3 tests/validate.py
          python3 tests/performance_contract.py
          python3 tests/operations_contract.py
          python3 tests/debug_actions_031.py
          python3 tests/wce_manifest.py
          python3 tests/rhf_040_contracts.py
          python3 tests/rhf_050_diplomacy.py
          python3 tests/precept_notes_032.py
          python3 tests/csharp_lexical_050.py
          python3 tests/rhf_060_coalitions.py
          python3 tests/rhf_061_compile_contract.py
          python3 tests/rhf_070_regressions.py
          python3 tests/rhf_080_mercy_and_drops.py
          python3 tests/rhf_090_tactical.py
          python3 tests/rhf_091_guest_api.py
          python3 tests/rhf_092_psychological_cruelty.py
          python3 tests/rhf_100_death_and_reprisals.py
          python3 tests/rhf_101_native_precept_mood.py
          python3 tests/rhf_110_family_escort_dialogue.py
          python3 tests/rhf_120_conversion_campaigns.py
          python3 tests/rhf_121_coherent_ops.py
          python3 tests/rhf_123_rescue_control.py
          python3 tests/rhf_124_rescue_command.py
          python3 tests/rhf_125_combat_planner.py
          python3 tests/rhf_126_smart_routes_and_cover.py
          python3 tests/rhf_127_faction_and_strength.py
          python3 tests/rhf_128_route_control.py
          python3 tests/rhf_129_firebreak.py
          python3 tests/rhf_130_mission_integrity.py
          python3 tests/rhf_131_vip_job_recovery.py
          python3 tests/rhf_132_mission_authority.py
          python3 tests/rhf_133_arrival_and_lord.py
          python3 tests/rhf_134_owner_integrity.py
          python3 tests/rhf_135_s1_rescue_contracts.py
          python3 tests/rhf_136_tactical_playtest_contracts.py
          python3 tests/rhf_137_harmony_hotfix_contracts.py
          python3 tests/rhf_138_air_only_pod_gate.py
          python3 tests/rhf_139_assembly_breach_fortify.py
          python3 tests/rhf_140_s221_engineer_door_contact.py
      - name: Restore RimWorld 1.7 / Harmony 3 references
        run: dotnet restore RaidersHaveFamilies/Source/RaidersHaveFamilies.csproj
      - name: Compile mod DLL (fail on errors)
        run: dotnet build RaidersHaveFamilies/Source/RaidersHaveFamilies.csproj -c Release --no-restore
      - name: Verify compiled DLL
        run: test -s RaidersHaveFamilies/Assemblies/RaidersHaveFamilies.dll
      - name: Package installable mod
        run: |
          set -euxo pipefail
          mkdir -p _release/RaidersHaveFamilies
          cp -a RaidersHaveFamilies/About RaidersHaveFamilies/Languages RaidersHaveFamilies/Defs RaidersHaveFamilies/Textures RaidersHaveFamilies/Assemblies _release/RaidersHaveFamilies/
          cd _release
          zip -qr ../RaidersHaveFamilies_v0.13.3_RimWorld_1.7_INSTALL.zip RaidersHaveFamilies
      - name: Upload test build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RaidersHaveFamilies-RimWorld-1.7-v0.13.3-S2.2.1-ENGINEER-DOOR-CONTACT-TEST
          path: RaidersHaveFamilies_v0.13.3_RimWorld_1.7_INSTALL.zip
          if-no-files-found: error
